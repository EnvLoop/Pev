name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [personal-decisions, decision-eval]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: packages/${{ matrix.package }}/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests -t . -v
      - name: Script tests (scripts/test_*.py, decision-eval environment)
        if: matrix.package == 'decision-eval'
        working-directory: .
        run: uv run --locked --project packages/decision-eval python -m unittest discover -s scripts -p 'test_*.py' -v
