[project]
name = "personal-decisions"
version = "0.1.0"
description = "Knowledge base, question families and rendering for MUSE-style personal decision records (Kev format)"
requires-python = ">=3.12,<3.13"
dependencies = [
  # astra renderer and optional LLM memory extraction (OpenAI-compatible API, Responses API)
  "openai==3.22.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
]

[project.scripts]
personal-decisions = "personal_decisions.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
